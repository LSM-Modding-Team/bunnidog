name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build checkBunnidogModel runGameTestServer

      - name: Retain internal CI archive (use Download JAR link)
        uses: actions/upload-artifact@v4
        with:
          name: ci-transfer-bunnidogs-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

  download:
    name: Publish direct JAR download
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-transfer-bunnidogs-${{ github.sha }}
          path: build/libs
      - name: Publish verified build as a direct JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish_jar.sh
